services:
  jeecg-boot-mysql:
    image: mysql:8.0
    restart: always
    container_name: jeecg-boot-mysql
    hostname: jeecg-boot-mysql
    ports:
      - ${MYSQL_PORT}:3306
    env_file:
      - ./.env
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DB}
    command: ["--lower_case_table_names=1"]
    volumes:
      - ./mysql/data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    networks:
      - share-net

  jeecg-boot-redis:
    image: redis:7-alpine
    ports:
      - ${REDIS_PORT}:6379
    restart: always
    container_name: jeecg-boot-redis
    hostname: jeecg-boot-redis
    env_file:
      - ./.env
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    networks:
      - share-net

  jeecg-boot-kafka:
    image: apache/kafka:4.0.0
    restart: always
    container_name: jeecg-boot-kafka
    hostname: jeecg-boot-kafka
    ports:
      - "${KAFKA_EXTERNAL_PORT:-9094}:9094"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://jeecg-boot-kafka:9092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-127.0.0.1}:${KAFKA_EXTERNAL_PORT:-9094}
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@jeecg-boot-kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 6
    volumes:
      - ./kafka/data:/var/lib/kafka/data
    networks:
      - share-net

  jeecg-boot-clickhouse:
    image: clickhouse/clickhouse-server:26.3.22.7
    restart: always
    container_name: jeecg-boot-clickhouse
    hostname: jeecg-boot-clickhouse
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    env_file:
      - ./.env
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-jeecg_analytics}
      CLICKHOUSE_USER: ${CLICKHOUSE_USERNAME:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-demo}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - ./clickhouse/data:/var/lib/clickhouse
      - ./clickhouse/log:/var/log/clickhouse-server
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$$CLICKHOUSE_USER\" --password \"$$CLICKHOUSE_PASSWORD\" --query \"SELECT 1\""]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - share-net

  jeecg-boot-pgvector:
    image: registry.cn-hangzhou.aliyuncs.com/jeecgdocker/pgvector
    restart: always
    container_name: jeecg-boot-pgvector
    hostname: jeecg-boot-pgvector
    profiles:
      - postiz
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-demo}
      POSTGRES_DB: ${POSTGRES_VECTOR_DB:-vector_db}
      POSTIZ_DB_NAME: ${POSTIZ_DB_NAME:-postiz}
      POSTIZ_DB_USER: ${POSTIZ_DB_USER:-postiz}
      POSTIZ_DB_PASSWORD: ${POSTIZ_DB_PASSWORD:-demo}
    volumes:
      - jeecg-postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - share-net

  jeecg-boot-system:
    build:
      context: ./system
    restart: on-failure
    container_name: jeecg-boot-system
    image: jeecg-boot-system
    hostname: jeecg-boot-system
    ports:
      - 8080:8080
    env_file:
      - ./.env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-jeecg-boot-kafka:9092}
      RECOMMEND_ETL_ENABLED: "true"
      RECOMMEND_ETL_DISPATCH_MODE: kafka
      RECOMMEND_ETL_PYTHON_EXECUTABLE: python3
      RECOMMEND_ETL_SCRIPT_ROOT: /opt/etl/scripts
      RECOMMEND_ETL_OUTPUT_ROOT: /opt/etl/output
      RECOMMEND_ETL_LOG_ROOT: /opt/etl/logs
    depends_on:
      - jeecg-boot-mysql
      - jeecg-boot-redis
      - jeecg-boot-kafka
      - jeecg-boot-clickhouse
    networks:
      - share-net
    volumes:
      - ./etl/scripts:/opt/etl/scripts:ro
      - ./etl/output:/opt/etl/output
      - ./etl/logs:/opt/etl/logs

networks:
  share-net:
    name: share-net

volumes:
  jeecg-postgres-data:
    name: jeecg-postgres-data
