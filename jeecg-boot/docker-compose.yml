version: '2'
services:
  jeecg-boot-mysql:
    build:
      context: ./db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ROOT_HOST: '%'
      TZ: Asia/Shanghai
    restart: always
    container_name: jeecg-boot-mysql
    image: jeecg-boot-mysql
    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --explicit_defaults_for_timestamp=true
      --lower_case_table_names=1
      --max_allowed_packet=128M
      --default-authentication-plugin=caching_sha2_password
    ports:
      - 13306:3306
    networks:
      - jeecg-boot

  jeecg-boot-redis:
    image: redis:7-alpine
#    ports:
#      - 6379:6379
    restart: always
    hostname: jeecg-boot-redis
    container_name: jeecg-boot-redis
    networks:
      - jeecg-boot

  jeecg-boot-kafka:
    image: apache/kafka:4.0.0
    restart: always
    container_name: jeecg-boot-kafka
    hostname: jeecg-boot-kafka
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://jeecg-boot-kafka:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@jeecg-boot-kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 6
    volumes:
      - ./kafka/data:/var/lib/kafka/data
    networks:
      - jeecg-boot

  jeecg-boot-clickhouse:
    image: clickhouse/clickhouse-server:26.3.22.7
    restart: always
    container_name: jeecg-boot-clickhouse
    hostname: jeecg-boot-clickhouse
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-jeecg_analytics}
      CLICKHOUSE_USER: ${CLICKHOUSE_USERNAME:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-demo}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - ./clickhouse/data:/var/lib/clickhouse
      - ./clickhouse/log:/var/log/clickhouse-server
      - ./docker-deploy/monolith/clickhouse/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$$CLICKHOUSE_USER\" --password \"$$CLICKHOUSE_PASSWORD\" --query \"SELECT 1\""]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - jeecg-boot

  jeecg-boot-pgvector:
    image: registry.cn-hangzhou.aliyuncs.com/jeecgdocker/pgvector
    container_name: jeecg-boot-pgvector
    hostname: jeecg-boot-pgvector
    profiles:
      - postiz
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-demo}
      POSTGRES_DB: ${POSTGRES_VECTOR_DB:-vector_db}
      POSTIZ_DB_NAME: ${POSTIZ_DB_NAME:-postiz}
      POSTIZ_DB_USER: ${POSTIZ_DB_USER:-postiz}
      POSTIZ_DB_PASSWORD: ${POSTIZ_DB_PASSWORD:-demo}
    volumes:
      - ./docker-data/postgres/data:/var/lib/postgresql/data
      - ./docker-deploy/monolith/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always
    networks:
      - jeecg-boot
  
#  jeecg-boot-rabbitmq:
#    image: rabbitmq:3.7.7-management
##    ports:
##      - 5672:5672
##      - 15672:15672
#    restart: always
#    container_name: jeecg-boot-rabbitmq
#    hostname: jeecg-boot-rabbitmq
#    environment:
#      RABBITMQ_DEFAULT_USER: guest
#      RABBITMQ_DEFAULT_PASS: guest
#    networks:
#      - jeecg-boot

  jeecg-boot-system:
    build:
      context: ./jeecg-module-system/jeecg-system-start
    restart: on-failure
    mac_address: 02:42:ac:11:00:02
    depends_on:
      - jeecg-boot-mysql
      - jeecg-boot-redis
      - jeecg-boot-kafka
      - jeecg-boot-clickhouse
    container_name: jeecg-boot-system
    image: jeecg-boot-system
    hostname: jeecg-boot-system
    ports:
      - 8080:8080
    environment:
      KAFKA_BOOTSTRAP_SERVERS: jeecg-boot-kafka:9092
      TS_BEHAVIOR_KAFKA_ENABLED: "false"
      CLICKHOUSE_URL: jdbc:clickhouse:http://jeecg-boot-clickhouse:8123/${CLICKHOUSE_DB:-jeecg_analytics}
      CLICKHOUSE_USERNAME: ${CLICKHOUSE_USERNAME:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-demo}
      RECOMMEND_ETL_ENABLED: "true"
      RECOMMEND_ETL_DISPATCH_MODE: kafka
      RECOMMEND_ETL_PYTHON_EXECUTABLE: python3
      RECOMMEND_ETL_SCRIPT_ROOT: /opt/etl/scripts
      RECOMMEND_ETL_OUTPUT_ROOT: /opt/etl/output
      RECOMMEND_ETL_LOG_ROOT: /opt/etl/logs
    networks:
      - jeecg-boot
    volumes:
      - ./config:/jeecg-boot/config
      - ./etl/scripts:/opt/etl/scripts:ro
      - ./etl/output:/opt/etl/output
      - ./etl/logs:/opt/etl/logs

networks:
  jeecg-boot:
    name: jeecg_boot
